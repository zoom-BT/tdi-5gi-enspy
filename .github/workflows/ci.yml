name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Interdire les bibliothèques de traitement d'images dans src/
        run: |
          ! grep -rnE "^\s*(import|from)\s+(cv2|skimage|scipy)" src/
          ! grep -rn "np.fft" src/timg/ch04_fourier/fft.py
      - run: pytest -q --cov=timg
