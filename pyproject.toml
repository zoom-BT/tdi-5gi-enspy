[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timg"
version = "0.1.0"
description = "Traitement d'images - implémentations numpy des algorithmes du cours 5GI ENSPY"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "matplotlib", "scipy", "scikit-image", "opencv-python-headless"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
